	<script>
		$(document).ready(function(){
			if(localStorage.nip && localStorage.id){
					  window.location = 'index.html';
			}
		});

		function login(){
			var x = $('#nip').val();
			var p = $('#pass').val();
			if(x == '' || p == ''){
				alert("NIP & Password tidak boleh kosong");
			}else{
			$.ajax({
				type: "GET",
				url: "http://siap.bkd.probolinggokab.go.id:8080/bkd_laravel/public/rest/resource/login",
				data: {nip:x,password:p},
				dataType:'json',
				success: function (data) {
					var x = data.data;
					if(data.status == 'true'){
						localStorage.setItem("id", x.pegawai_id);
						localStorage.setItem("nip", x.nip_baru);
						window.location = "index.html";
					}else{
						alert("NIP Tidak ditemukan dalam sistem");
					}
				}
	});
			
			}
			
		}
	</script>
